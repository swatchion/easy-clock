name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNOME extension build & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            gjs \
            gnome-shell \
            jq \
            libglib2.0-bin \
            tzdata \
            unzip \
            xvfb \
            zip

      - name: Sync metadata version-name from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "${VERSION}" '.["version-name"] = $v' src/metadata.json > src/metadata.json.tmp
          mv src/metadata.json.tmp src/metadata.json

      - name: Package extension & run test suite
        run: |
          xvfb-run -a env GSK_RENDERER=cairo make test

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum easy-clock@swatchion.github.io.shell-extension.zip > SHA256SUMS.txt

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-clock-shell-extension
          path: |
            dist/easy-clock@swatchion.github.io.shell-extension.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release via GitHub CLI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && \
            gh release upload "${GITHUB_REF_NAME}" \
              dist/easy-clock@swatchion.github.io.shell-extension.zip \
              dist/SHA256SUMS.txt \
              --clobber || \
            gh release create "${GITHUB_REF_NAME}" \
              dist/easy-clock@swatchion.github.io.shell-extension.zip \
              dist/SHA256SUMS.txt \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
